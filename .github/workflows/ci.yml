name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # The suite runs entirely on the simulator, so CI needs no network and no
      # downloaded dataset. Ground truth is what makes the learners assertable.
      - run: python -m pytest tests -q
